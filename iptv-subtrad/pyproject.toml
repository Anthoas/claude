[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subtrad"
version = "0.1.0"
description = "Lecteur IPTV qui traduit les sous-titres à la volée (FR -> ID) avec Claude"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.2",
    "pysubs2>=1.7",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "numpy"]
# Transcription de la voix : mlx-whisper sur Mac à puce Apple, faster-whisper ailleurs.
whisper = [
    "numpy",
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.1; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

[project.scripts]
subtrad = "subtrad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
subtrad = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
