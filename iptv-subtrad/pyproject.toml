[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subtrad"
version = "0.1.0"
description = "Lecteur IPTV qui traduit les sous-titres à la volée (FR -> ID) avec Claude"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.2",
    "pysubs2>=1.7",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Transcription hors Mac. Sur Mac : `brew install whisper-cpp` (aucune dépendance Python).
whisper = ["faster-whisper>=1.1"]

[project.scripts]
subtrad = "subtrad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
subtrad = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
